rest_call_prompt:
  type: prompt
  description: "AcNavi REST エンドポイントを rest_call で利用するための指示"
  prompt: |
    REST へのアクセスは必ず rest_call を使用すること。
    glossary の teikei_* / requests_* / meisai_* から適切なパスを選ぶこと。
    request.method（GET/POST/PUT/DELETE）と request.path（先頭に / を付けない）を必ず指定する。
    パスに {template_id}/{reqID}/{objectID} が含まれる場合、ユーザーに値を確認する。
    「meisai」など曖昧なパスは避け、必ず具体的なパス（例: "meisai/objects"）を使う。

teikei_list:
  type: glossary
  definition: "GET teikei/objects — 定型検索オブジェクト一覧の取得"

teikei_detail:
  type: glossary
  definition: "GET teikei/objects/{template_id} — 定型検索オブジェクト詳細の取得"

teikei_execute:
  type: glossary
  definition: "POST teikei/objects/search/{template_id} — 定型検索オブジェクトの実行"

teikei_update:
  type: glossary
  definition: "PUT teikei/objects/{template_id} — 定型検索オブジェクトの更新"

teikei_delete:
  type: glossary
  definition: "DELETE teikei/objects/{template_id} — 定型検索オブジェクトの削除"

requests_list:
  type: glossary
  definition: "GET requests/list — 検索結果一覧の取得"

requests_info:
  type: glossary
  definition: "GET requests/{reqID}/info — 検索結果詳細の取得"

requests_delete:
  type: glossary
  definition: "DELETE requests/{reqID} — 検索結果の削除"

meisai_list:
  type: glossary
  definition: "GET meisai/objects — 明細型検索オブジェクト一覧の取得"

meisai_detail:
  type: glossary
  definition: "GET meisai/objects/{objectID} — 明細型検索オブジェクト詳細の取得"

meisai_update:
  type: glossary
  definition: "PUT meisai/objects/{objectID} — 明細型検索オブジェクトの更新"

meisai_execute:
  type: glossary
  definition: "POST meisai/objects/search/{objectID} — 明細型検索オブジェクトの実行"

meisai_delete:
  type: glossary
  definition: "DELETE meisai/objects/{objectID} — 明細型検索オブジェクトの削除"

meisai_save:
  type: glossary
  definition: "PUT meisai/object — 明細型検索オブジェクトの保存"

meisai_open:
  type: glossary
  definition: "GET meisai/objects/open/{objectID} — 明細型検索オブジェクト詳細情報の取得"
