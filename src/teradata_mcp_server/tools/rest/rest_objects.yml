rest_call_prompt:
  type: prompt
  description: "AcNavi REST エンドポイントを rest_call で利用するための指示"
  prompt: |
    REST へのアクセスは必ず rest_call を使用すること。
    request.endpoint には rest_call の入力スキーマに表示される論理エンドポイント名を指定すること。
    パスに必要な ID は request.path_params に指定すること。
    method と path は後方互換用であり、通常は endpoint を使用すること。
